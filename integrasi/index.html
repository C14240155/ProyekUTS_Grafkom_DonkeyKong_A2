        #hud {
            position: fixed; left: 12px; bottom: 12px; max-width: calc(100% - 24px);
            padding: 8px 12px; border-radius: 8px;

            font: 13px/1.55 system-ui, sans-serif; pointer-events: none; z-index: 10;
        }
        #hud .dim { opacity: 0.75; font-size: 12px; }
        #hud kbd { font: 11px ui-monospace, monospace; padding: 0 4px; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; }
